[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "focus-agent"
version = "1.0.0"
description = "A self-hosted, branch-aware Agent workbench and platform reference with streaming APIs, observability, memory, delegation workflows, and a typed SDK."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "alembic>=1.13.0",
  "langchain>=1.2.0,<2.0.0",
  "langgraph>=1.1.0,<2.0.0",
  "langgraph-sdk>=0.1.0",
  "langgraph-checkpoint-postgres>=3.0.0,<4.0.0",
  "langsmith>=0.4.43",
  "psycopg>=3.2.0,<4.0.0",
  "pydantic>=2.8.0",
  "fastapi>=0.115.0,<1.0.0",
  "httpx>=0.27.0",
  "uvicorn>=0.34.0,<1.0.0",
  "ddgs>=9.6.0",
  "opentelemetry-sdk>=1.31.0,<2.0.0",
  "opentelemetry-exporter-otlp-proto-http>=1.31.0,<2.0.0",
  "tiktoken>=0.12.0,<1.0.0",
  "networkx>=3.1",
]

[project.optional-dependencies]
openai = ["langchain-openai>=1.0.0"]
anthropic = ["langchain-anthropic>=1.0.0"]
mcp = ["mcp>=1.27,<2"]
retrieval = ["zvec>=0.5.1"]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.8.0",
    "httpx>=0.28.0",
    "coverage[toml]>=7.4",
]

[project.scripts]
focus-agent-demo = "focus_agent.cli.demo:main"
focus-agent-api = "focus_agent.api.cli:main"
focus-agent-migrate-local-state = "focus_agent.cli.migrate_local_state:main"
focus-agent-memory-embedding = "focus_agent.cli.memory_embedding:main"
focus-agent-retrieval-index = "focus_agent.cli.retrieval_index:main"
focus-agent-trajectory = "focus_agent.cli.trajectory:main"
focus-agent-prompts = "focus_agent.prompts.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
focus_agent = ["defaults/*.toml", "prompts/library/*.yaml", "skills/builtin/*/SKILL.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Agent-written dataset evidence is kept verbatim as an audit record.
extend-exclude = ["tests/eval/datasets/branch_ab/evidence"]

[tool.ruff.lint]
# Keep the first Python quality gate intentionally narrow so it does not force a
# repository-wide cleanup. Import sorting (I), line-length (E501), warnings (W),
# naming (N), annotations (ANN), and complexity (C90/PLR)
# can be enabled after the existing backlog is fixed in smaller batches.
select = ["E4", "E7", "E9", "F", "B", "I", "UP"]
ignore = [
  # Existing code intentionally strips a small set of punctuation characters.
  "B005",
  # FastAPI and CLI defaults use call expressions in dependency/default values.
  "B008",
  # Existing code uses getattr defensively for external/dynamic records.
  "B009",
  # Existing provider glue zips sequences whose lengths are owned upstream.
  "B905",
]

[tool.ruff.lint.per-file-ignores]
"src/focus_agent/services/branches.py" = ["F403"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

name: Release Gate

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: "Release id used for the evidence pack. Required when dry_run is false."
        required: false
        type: string
      dry_run:
        description: "Use release-gate planning and deterministic evidence samples."
        required: true
        default: true
        type: boolean
      retention_days:
        description: "Retention window recorded in release evidence metadata."
        required: true
        default: "90"
        type: string

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-gate-dry-run:
    name: Release gate dry-run
    if: ${{ inputs.dry_run == true }}
    runs-on: ubuntu-latest
    env:
      RELEASE_ID: ${{ inputs.release_id || github.ref_name || github.sha }}
      DRY_RUN: "true"
      ENVIRONMENT_NAME: release-dry-run
      APPROVAL_URL: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
      RETENTION_DAYS: ${{ inputs.retention_days || '90' }}
      ARTIFACT_STORAGE_DIR: reports/release-gate/dry-run/archive
      RELEASE_GATE_ARTIFACT_NAME: release-gate-dry-run-reports-${{ github.run_id }}-${{ github.run_attempt }}
      DEPLOYMENT_BINDING_JSON: reports/release-gate/dry-run/deployment-binding.json
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Enable pnpm
        run: corepack enable

      - name: Install Python dependencies
        run: make install-openai

      - name: Install frontend SDK dependencies
        run: make sdk-install

      - name: Install web dependencies
        run: make web-install

      - name: Validate dry-run deployment binding metadata
        run: |
          mkdir -p reports/release-gate/dry-run
          python scripts/release_gate.py deployment-binding --output "$DEPLOYMENT_BINDING_JSON"

      - name: Run release gate dry-run
        run: make release-gate RELEASE_GATE_ARGS="--dry-run --report-json reports/release-gate/dry-run/latest.json"

      - name: Build dry-run release evidence
        run: |
          make release-evidence RELEASE_EVIDENCE_ARGS="--dry-run --release-id ${RELEASE_ID:-${GITHUB_SHA::7}} --output-root reports/release-gate/dry-run/evidence --approval-id gha-dry-run-${GITHUB_RUN_ID} --approval-status approved --approval-url ${APPROVAL_URL} --retention-days ${RETENTION_DAYS} --storage-dir ${ARTIFACT_STORAGE_DIR}"

      - name: Upload dry-run release gate reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.RELEASE_GATE_ARTIFACT_NAME }}
          path: reports/release-gate/dry-run/
          retention-days: ${{ fromJSON(env.RETENTION_DAYS) }}
          if-no-files-found: ignore

  release-gate-production:
    name: Release gate production
    if: ${{ inputs.dry_run == false }}
    runs-on: ubuntu-latest
    environment: production
    env:
      RELEASE_ID: ${{ inputs.release_id || github.ref_name || github.sha }}
      DRY_RUN: "false"
      ENVIRONMENT_NAME: production
      RELEASE_COMMIT_SHA: ${{ github.sha }}
      RELEASE_DEPLOYMENT_ID: ${{ vars.FOCUS_AGENT_DEPLOYMENT_ID }}
      RELEASE_DEPLOYMENT_VERSION: ${{ vars.FOCUS_AGENT_DEPLOYMENT_VERSION }}
      RELEASE_ENVIRONMENT: production
      APPROVAL_ID: github-environment-production-${{ github.run_id }}-${{ github.run_attempt }}
      APPROVAL_STATUS: approved
      APPROVAL_URL: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
      RETENTION_DAYS: ${{ inputs.retention_days || '90' }}
      ARTIFACT_STORAGE_DIR: reports/release-gate/archive
      RELEASE_GATE_ARTIFACT_NAME: release-gate-reports-${{ github.run_id }}-${{ github.run_attempt }}
      DEPLOYMENT_BINDING_JSON: reports/release-gate/deployment-binding.json
      BASE_URL: ${{ vars.FOCUS_AGENT_BASE_URL }}
      READY_URL: ${{ vars.FOCUS_AGENT_READY_URL }}
      TRAJECTORY_STATS_URL: ${{ vars.FOCUS_AGENT_TRAJECTORY_STATS_URL }}
      REPLAY_COMPARISONS_URL: ${{ vars.FOCUS_AGENT_REPLAY_COMPARISONS_URL }}
      ALERT_REPORT_URL: ${{ vars.FOCUS_AGENT_ALERT_REPORT_URL }}
      POSTGRES_MIGRATION_REPORT_URL: ${{ vars.FOCUS_AGENT_POSTGRES_MIGRATION_REPORT_URL }}
      BASELINE_EVAL_REPORT_URL: ${{ vars.FOCUS_AGENT_BASELINE_EVAL_REPORT_URL }}
      AUTH_TOKEN: ${{ secrets.FOCUS_AGENT_SMOKE_AUTH_TOKEN || vars.FOCUS_AGENT_SMOKE_AUTH_TOKEN }}
      STREAM_EVENTS_REPORT_URL: ${{ vars.FOCUS_AGENT_STREAM_EVENTS_REPORT_URL }}
      STREAM_EVENTS_URL: ${{ vars.FOCUS_AGENT_STREAM_EVENTS_URL }}
      DATABASE_URI: ${{ secrets.FOCUS_AGENT_DATABASE_URI || vars.FOCUS_AGENT_DATABASE_URI }}
      POSTGRES_BACKUP_COMMAND: ${{ secrets.FOCUS_AGENT_POSTGRES_BACKUP_COMMAND || vars.FOCUS_AGENT_POSTGRES_BACKUP_COMMAND }}
      POSTGRES_RESTORE_COMMAND: ${{ secrets.FOCUS_AGENT_POSTGRES_RESTORE_COMMAND || vars.FOCUS_AGENT_POSTGRES_RESTORE_COMMAND }}
      POSTGRES_RESTORE_VERIFICATION_QUERY: ${{ secrets.FOCUS_AGENT_POSTGRES_RESTORE_VERIFICATION_QUERY || vars.FOCUS_AGENT_POSTGRES_RESTORE_VERIFICATION_QUERY }}
      POSTGRES_RETENTION_CLEANUP_QUERY: ${{ secrets.FOCUS_AGENT_POSTGRES_RETENTION_CLEANUP_QUERY || vars.FOCUS_AGENT_POSTGRES_RETENTION_CLEANUP_QUERY }}
      OTEL_ENDPOINT: ${{ vars.FOCUS_AGENT_OTEL_ENDPOINT }}
      OTEL_COLLECTOR_HEALTH_URL: ${{ vars.FOCUS_AGENT_OTEL_COLLECTOR_HEALTH_URL }}
      OTEL_TRACE_QUERY_URL: ${{ vars.FOCUS_AGENT_OTEL_TRACE_QUERY_URL }}
      GOVERNANCE_REPORT_JSON: reports/agent-governance/latest.json
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Enable pnpm
        run: corepack enable

      - name: Install Python dependencies
        run: make install-openai

      - name: Install frontend SDK dependencies
        run: make sdk-install

      - name: Install web dependencies
        run: make web-install

      - name: Validate deployment binding metadata
        run: |
          mkdir -p reports/release-gate
          python scripts/release_gate.py deployment-binding --output "$DEPLOYMENT_BINDING_JSON"

      - name: Run release gate
        run: make release-gate

      - name: Capture production release signals
        run: |
          set -euo pipefail
          mkdir -p reports/release-gate
          test -n "$BASE_URL"
          test -n "$READY_URL"
          test -n "$TRAJECTORY_STATS_URL"
          test -n "$REPLAY_COMPARISONS_URL"
          test -n "$ALERT_REPORT_URL"
          test -n "$POSTGRES_MIGRATION_REPORT_URL"
          test -n "$BASELINE_EVAL_REPORT_URL"
          test "$ENVIRONMENT_NAME" = "production"
          test -n "$RELEASE_COMMIT_SHA"
          test "$RELEASE_COMMIT_SHA" = "$GITHUB_SHA"
          test -n "$RELEASE_DEPLOYMENT_ID"
          test -n "$RELEASE_DEPLOYMENT_VERSION"
          test -n "$RELEASE_ENVIRONMENT"
          test "$RELEASE_ENVIRONMENT" = "production"
          test -n "$ARTIFACT_STORAGE_DIR"
          test -n "$RELEASE_GATE_ARTIFACT_NAME"
          test -n "$RETENTION_DAYS"
          test -n "$AUTH_TOKEN"
          test -n "$DATABASE_URI"
          test -n "$POSTGRES_BACKUP_COMMAND"
          test -n "$POSTGRES_RESTORE_COMMAND"
          test -n "$POSTGRES_RESTORE_VERIFICATION_QUERY"
          test -n "$POSTGRES_RETENTION_CLEANUP_QUERY"
          test -n "$OTEL_ENDPOINT"
          test -n "$OTEL_COLLECTOR_HEALTH_URL"
          test -n "$OTEL_TRACE_QUERY_URL"

          capture_release_json() {
            local artifact_name="$1"
            local source_url="$2"
            local output_path="$3"
            shift 3

            local raw_dir
            local raw_path
            raw_dir="$(mktemp -d "${RUNNER_TEMP:?}/focus-agent-${artifact_name}.XXXXXX")"
            raw_path="${raw_dir}/${artifact_name}.json"
            rm -f "$output_path"
            if ! curl --fail --show-error --silent --output "$raw_path" -- "$source_url"; then
              rm -rf "$raw_dir"
              return 1
            fi
            if [ "$artifact_name" = "readyz" ]; then
              if ! uv run python scripts/release_evidence_capture.py \
                "$raw_path" \
                --output "$output_path" \
                --readyz "$raw_path" \
                "$@"; then
                rm -rf "$raw_dir"
                rm -f "$output_path"
                return 1
              fi
            else
              if ! uv run python scripts/release_evidence_capture.py \
                "$raw_path" \
                --output "$output_path" \
                "$@"; then
                rm -rf "$raw_dir"
                rm -f "$output_path"
                return 1
              fi
            fi
            rm -rf "$raw_dir"
          }

          capture_release_json \
            readyz \
            "$READY_URL" \
            reports/release-gate/readyz.json \
            --captured-now
          capture_release_json \
            trajectory_stats \
            "$TRAJECTORY_STATS_URL" \
            reports/release-gate/trajectory-stats.json \
            --captured-now
          capture_release_json \
            replay_comparisons \
            "$REPLAY_COMPARISONS_URL" \
            reports/release-gate/replay-comparisons.json
          capture_release_json \
            alert_report \
            "$ALERT_REPORT_URL" \
            reports/release-gate/alert-report.json
          capture_release_json \
            postgres_migration_report \
            "$POSTGRES_MIGRATION_REPORT_URL" \
            reports/release-gate/postgres-migration.json
          capture_release_json \
            baseline_eval_report \
            "$BASELINE_EVAL_REPORT_URL" \
            reports/release-gate/baseline-eval-smoke.json
          stream_args=()
          if [ -n "$STREAM_EVENTS_REPORT_URL" ]; then
            capture_release_json \
              stream_events \
              "$STREAM_EVENTS_REPORT_URL" \
              reports/release-gate/stream-events.json
            stream_args+=(--stream-events-json reports/release-gate/stream-events.json)
          elif [ -n "$STREAM_EVENTS_URL" ]; then
            stream_args+=(--stream-events-url "$STREAM_EVENTS_URL")
          else
            echo "STREAM_EVENTS_REPORT_URL or STREAM_EVENTS_URL is required for production smoke" >&2
            exit 1
          fi
          uv run python scripts/production_smoke.py \
            --base-url "$BASE_URL" \
            --auth-token "$AUTH_TOKEN" \
            "${stream_args[@]}" \
            --report-json reports/release-gate/production-smoke.json
          uv run python scripts/postgres_ops.py \
            --database-uri "$DATABASE_URI" \
            --backup-command "$POSTGRES_BACKUP_COMMAND" \
            --restore-command "$POSTGRES_RESTORE_COMMAND" \
            --restore-verification-query "$POSTGRES_RESTORE_VERIFICATION_QUERY" \
            --retention-cleanup-query "$POSTGRES_RETENTION_CLEANUP_QUERY" \
            --report-json reports/release-gate/postgres-ops.json
          uv run python scripts/otel_smoke.py \
            --endpoint "$OTEL_ENDPOINT" \
            --collector-health-url "$OTEL_COLLECTOR_HEALTH_URL" \
            --trace-query-url "$OTEL_TRACE_QUERY_URL" \
            --service-name focus-agent \
            --report-json reports/release-gate/otel-smoke.json
          test -s "$GOVERNANCE_REPORT_JSON"

      - name: Build production release evidence
        run: |
          test -n "$RELEASE_ID"
          test -n "$APPROVAL_ID"
          test "$APPROVAL_STATUS" = "approved"
          make release-evidence RELEASE_EVIDENCE_ARGS="--release-id ${RELEASE_ID} --approval-id ${APPROVAL_ID} --approval-status ${APPROVAL_STATUS} --approval-url ${APPROVAL_URL} --retention-days ${RETENTION_DAYS} --storage-dir ${ARTIFACT_STORAGE_DIR} --readyz-json reports/release-gate/readyz.json --trajectory-stats-json reports/release-gate/trajectory-stats.json --replay-comparisons-json reports/release-gate/replay-comparisons.json --alert-report-json reports/release-gate/alert-report.json --postgres-migration-report-json reports/release-gate/postgres-migration.json --production-smoke-report-json reports/release-gate/production-smoke.json --postgres-ops-report-json reports/release-gate/postgres-ops.json --otel-smoke-report-json reports/release-gate/otel-smoke.json --governance-report-json ${GOVERNANCE_REPORT_JSON} --eval-report-json reports/release-gate/eval-smoke.json --eval-report-json reports/release-gate/eval-observability.json --eval-report-json reports/release-gate/eval-golden-multi-agent.json --eval-report-json reports/release-gate/eval-harness-stability.json --eval-report-json reports/release-gate/memory-context-eval.json --baseline-eval-report-json reports/release-gate/baseline-eval-smoke.json"

      - name: Upload production release gate reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.RELEASE_GATE_ARTIFACT_NAME }}
          path: reports/release-gate/
          retention-days: ${{ fromJSON(env.RETENTION_DAYS) }}
          if-no-files-found: ignore

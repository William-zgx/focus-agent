name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  python:
    name: Python lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python dependencies
        run: uv pip install --system -e '.[openai,dev]'

      - name: Run Ruff
        run: ruff check .

      - name: Run pytest
        run: FOCUS_AGENT_LOCAL_ENV_FILE=/tmp/focus-agent-ci-missing.env pytest

  contracts:
    name: Contract check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python dependencies
        run: uv pip install --system -e '.[openai,dev]'

      - name: Run contract check
        run: python3 scripts/check_contracts.py

  frontend:
    name: SDK and Web check/build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Install frontend workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend SDK
        run: pnpm sdk:check

      - name: Build frontend SDK
        run: pnpm sdk:build

      - name: Validate frontend SDK transport
        run: pnpm --dir frontend-sdk validate:transport

      - name: Lint web app
        run: pnpm --filter @focus-agent/web-app lint

      - name: Format web app
        run: pnpm --filter @focus-agent/web-app format

      - name: Check web app
        run: pnpm web:check

      - name: Build web app
        run: pnpm web:build

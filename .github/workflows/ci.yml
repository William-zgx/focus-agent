name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  python:
    name: Python lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python dependencies
        run: make install-openai

      - name: Run Ruff
        run: make lint

      - name: Run pytest
        run: make ci-test

  contracts:
    name: Contract check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python dependencies
        run: make install-openai

      - name: Run contract check
        run: make contract-check

      - name: Check OpenAPI schema drift
        run: |
          uv run python scripts/export-openapi.py
          git diff --exit-code docs/api/openapi.json

  frontend:
    name: SDK and Web check/build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Install frontend workspace dependencies
        run: make web-install

      - name: Check frontend SDK
        run: make sdk-check

      - name: Check generated SDK OpenAPI types
        run: make sdk-openapi-types-check

      - name: Build frontend SDK
        run: make sdk-build

      - name: Validate frontend SDK transport
        run: make sdk-validate-transport

      - name: Lint web app
        run: make web-lint

      - name: Check web app formatting
        run: make web-format-check

      - name: Check web app
        run: make web-check

      - name: Build web app
        run: make web-build

      - name: Run stream frontend regression tests
        run: make test-thread-stream-frontend-regressions

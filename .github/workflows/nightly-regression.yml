name: Nightly Regression

on:
  workflow_dispatch:
    inputs:
      trajectory_input_json:
        description: "Optional trajectory export JSON/JSONL path for replay entrypoint testing."
        required: false
        type: string
      replay_report_json:
        description: "Optional replay report JSON path included in nightly aggregation."
        required: false
        type: string
      alert_report_json:
        description: "Optional alert report JSON path included in nightly aggregation."
        required: false
        type: string
  schedule:
    - cron: "17 19 * * *"

permissions:
  contents: read

concurrency:
  group: nightly-regression-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nightly-regression:
    name: Nightly regression reports
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python dependencies
        run: make install-openai

      - name: Restore nightly trend history
        uses: actions/cache/restore@v4
        with:
          path: reports/nightly/history
          key: nightly-regression-history-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            nightly-regression-history-${{ github.ref_name }}-
            nightly-regression-history-

      - name: Build memory/context nightly report
        env:
          TRAJECTORY_INPUT_JSON: ${{ inputs.trajectory_input_json }}
          REPLAY_REPORT_JSON: ${{ inputs.replay_report_json || 'reports/nightly/trajectory-replay.json' }}
          ALERT_REPORT_JSON: ${{ inputs.alert_report_json }}
        run: |
          extra_args=()
          if [ -n "$TRAJECTORY_INPUT_JSON" ]; then
            uv run python -m tests.eval replay \
              --from "$TRAJECTORY_INPUT_JSON" \
              --trajectory-input \
              --run \
              --concurrency 1 \
              --report-json "$REPLAY_REPORT_JSON" \
              --report-jsonl reports/nightly/trajectory-replay.jsonl
            extra_args+=(--replay-json "$REPLAY_REPORT_JSON")
          elif [ -n "$REPLAY_REPORT_JSON" ] && [ -f "$REPLAY_REPORT_JSON" ]; then
            extra_args+=(--replay-json "$REPLAY_REPORT_JSON")
          fi
          if [ -n "$ALERT_REPORT_JSON" ]; then
            extra_args+=(--alert-json "$ALERT_REPORT_JSON")
          fi
          make nightly-regression NIGHTLY_REGRESSION_ARGS="${extra_args[*]}"

      - name: Build nightly model matrix eval report
        if: always()
        continue-on-error: true
        run: |
          mkdir -p reports/nightly
          uv run python -m tests.eval \
            --suite model_matrix \
            --concurrency 1 \
            --report-json reports/nightly/eval-model-matrix.json \
            --report-jsonl reports/nightly/eval-model-matrix.jsonl \
            --report-html reports/nightly/eval-model-matrix.html

      - name: Build nightly trajectory failures eval report
        if: always()
        continue-on-error: true
        run: |
          mkdir -p reports/nightly
          uv run python -m tests.eval \
            --suite trajectory_failures \
            --concurrency 1 \
            --report-json reports/nightly/eval-trajectory-failures.json \
            --report-jsonl reports/nightly/eval-trajectory-failures.jsonl \
            --report-html reports/nightly/eval-trajectory-failures.html

      - name: Build Agent governance quality report
        run: make agent-governance-report

      - name: Ensure nightly trend history directory
        if: always()
        run: mkdir -p reports/nightly/history

      - name: Save nightly trend history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: reports/nightly/history
          key: nightly-regression-history-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload nightly reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-regression-${{ github.run_id }}
          path: |
            reports/nightly/
            reports/agent-governance/
            reports/release-gate/memory-context-*.json
            reports/nightly/trajectory-replay*.json*
          retention-days: 30
          if-no-files-found: ignore

name: Eval

on:
  pull_request:
    paths:
      - "src/focus_agent/engine/**"
      - "src/focus_agent/capabilities/**"
      - "src/focus_agent/memory/**"
      - "src/focus_agent/core/**"
      - "tests/eval/**"
      - "tests/test_eval_framework.py"
      - ".github/workflows/eval.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "src/focus_agent/engine/**"
      - "src/focus_agent/capabilities/**"
      - "src/focus_agent/memory/**"
      - "src/focus_agent/core/**"
      - "tests/eval/**"
      - "tests/test_eval_framework.py"
      - ".github/workflows/eval.yml"

jobs:
  eval:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python dependencies
        run: uv pip install --system -e '.[openai,dev]'

      - name: Run deterministic eval framework tests
        run: |
          mapfile -t discovered_tests < <(
            find tests/eval -maxdepth 1 -type f \( \
              -name 'test_*framework*.py' -o \
              -name 'test_golden_multi_agent*.py' -o \
              -name 'test_model_matrix*.py' -o \
              -name 'test_trajectory_failures*.py' \
            \) | sort
          )
          uv run pytest tests/test_eval_framework.py tests/eval/test_plan_act_reflect.py "${discovered_tests[@]}"

      - name: Run provider-backed smoke eval
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PROVIDER_EVAL_MISSING_KEY_POLICY: ${{ github.event_name == 'pull_request' && 'skip' || vars.PROVIDER_EVAL_MISSING_KEY_POLICY || 'skip' }}
        run: |
          mkdir -p reports
          uv run python scripts/eval_provider_gate.py \
            --key-env OPENAI_API_KEY \
            --missing-policy-env PROVIDER_EVAL_MISSING_KEY_POLICY \
            --gate-report-json reports/eval-provider-gate.json \
            --annotation-title "Provider-backed smoke eval skipped" \
            -- \
            uv run python -m tests.eval \
              --suite smoke \
              --concurrency 1 \
              --report-json reports/eval-smoke.json \
              --report-jsonl reports/eval-smoke.jsonl \
              --report-html reports/eval-smoke.html

      - name: Upload eval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: reports/
          if-no-files-found: ignore

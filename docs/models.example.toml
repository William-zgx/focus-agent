default_model = "ollama:qwen2.5:7b"
helper_model = "openai:gpt-4.1-mini"
model_choices = [
  "ollama:qwen2.5:7b",
  "openai:gpt-4.1-mini",
  "moonshot:kimi-k2.6",
  "mimo:mimo-v2.5-pro",
]

[[providers]]
id = "openai"
label = "OpenAI Compatible"
backend_provider = "openai"
base_url_env = "OPENAI_BASE_URL"
api_key_env = "OPENAI_API_KEY"
logo_slug = "openai"
logo_letter = "O"

[[providers]]
id = "moonshot"
label = "Moonshot AI"
backend_provider = "openai"
base_url_env = "MOONSHOT_BASE_URL"
base_url_default = "https://api.moonshot.cn/v1"
api_key_env = "MOONSHOT_API_KEY"
aliases = ["kimi"]
logo_slug = "moonshotai"
logo_letter = "K"

[[providers]]
id = "mimo"
label = "Xiaomi MiMo"
backend_provider = "openai"
base_url_env = "MIMO_BASE_URL"
base_url_default = "https://api.xiaomimimo.com/v1"
api_key_env = "MIMO_API_KEY"
aliases = ["xiaomi", "xiaomimimo"]
logo_letter = "M"

[[providers]]
id = "ollama"
label = "Ollama"
backend_provider = "openai"
base_url_env = "OLLAMA_BASE_URL"
base_url_default = "http://127.0.0.1:11434/v1"
api_key_env = "OLLAMA_API_KEY"
api_key_default = "ollama"
logo_slug = "ollama"
logo_letter = "O"

[[models]]
id = "openai:gpt-4.1-mini"
label = "GPT-4.1 Mini"

[[models]]
id = "moonshot:kimi-k2.6"
label = "Kimi K2.6"
supports_thinking = true
# Keep extended thinking opt-in until the provider's reasoning stream is
# suitable for the interaction and latency requirements of this deployment.
default_thinking_enabled = false
no_temperature = true
thinking_disable_extra_body_type = "disabled"

[[models]]
id = "mimo:mimo-v2.5-pro"
label = "MiMo V2.5 Pro"
supports_thinking = true
default_thinking_enabled = true

[[models]]
id = "ollama:qwen2.5:7b"
label = "Qwen 2.5 7B"

